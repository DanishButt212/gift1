}

@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.1)}28%{transform:scale(1)}42%{transform:scale(1.07)}}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
#splash h2{font-family:"Snell Roundhand","Segoe Script","Brush Script MT","Dancing Script",cursive;font-weight:600;

#splash p{margin:14px 0 0;font:500 clamp(12px,3.3vw,14px)/1.4 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.32em;

@keyframes blink{0%,100%{opacity:.55}50%{opacity:1}}
</style>

<script>
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const clamp01=v=>clamp(v,0,1);
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const rnd=(a,b)=>a+Math.random()*(b-a);
const mix=(p,q,t)=>[lerp(p[0],q[0],t),lerp(p[1],q[1],t),lerp(p[2],q[2],t)];
const rgb=(p,a=1)=>`rgba(${p[0]|0},${p[1]|0},${p[2]|0},${a})`;

/* rang: a = halka (pankhri ka kinara), b = gehra (pankhri ki jar), c = beech */
const PALS={
  pink:{a:[255,158,190],b:[214,51,108],c:[255,214,102]},
  red:{a:[255,104,120],b:[176,18,50],c:[255,200,87]},
  white:{a:[255,255,255],b:[224,218,244],c:[255,196,61]},
  purple:{a:[210,172,255],b:[124,77,214],c:[255,225,130]},
  gold:{a:[255,217,112],b:[244,140,40],c:[150,78,24]},
  peach:{a:[255,196,176],b:[238,112,100],c:[255,230,150]},
  blue:{a:[160,212,255],b:[72,122,226],c:[255,240,170]}
};

function petalPath(c,len,wd,notch){
  c.beginPath();
  c.moveTo(0,0);
  if(notch){
    c.bezierCurveTo(-wd,-len*.3,-wd*.85,-len*1.02,-wd*.2,-len*.98);
    c.quadraticCurveTo(-wd*.05,-len*.93,0,-len*.84);
    c.quadraticCurveTo(wd*.05,-len*.93,wd*.2,-len*.98);
  }else{
    c.bezierCurveTo(-wd,-len*.3,-wd*.85,-len*1.02,0,-len);
  }
  c.bezierCurveTo(wd*.85,-len*1.02,wd,-len*.3,0,0);
  c.closePath();
}

function newLook(type,pal,s){
  return {type,pal,s,rot:rnd(0,TAU),n:12+((Math.random()*5)|0),
    jit:Array.from({length:40},()=>rnd(-1,1)),sprite:null,half:0};
}

const ROSE_L=[[5,1,.64],[5,.8,.62],[4,.6,.63],[3,.42,.67],[3,.25,.76]];
const DAHLIA_L=[[13,1,.19],[11,.76,.21],[9,.54,.24],[6,.32,.28]];

function drawHead(c,f,b){
  const s=f.s,A=f.pal.a,B=f.pal.b,C=f.pal.c;
  b=clamp01(b);
  const e=easeBack(b),sc=.12+.88*e;
  c.save();
  if(f.type==='tulip'){
    c.scale(sc,sc);
    const a=.08+.2*easeOut(b),L=s*1.45;
    const g=c.createLinearGradient(0,0,0,-L);
    g.addColorStop(0,rgb(mix(B,[40,0,30],.3)));g.addColorStop(1,rgb(mix(A,B,.35)));
    const g2=c.createLinearGradient(0,0,0,-L);
    g2.addColorStop(0,rgb(B));g2.addColorStop(1,rgb(A));
    for(const r of [-a*2.1,a*2.1]){c.save();c.rotate(r);petalPath(c,L*.96,s*.4);c.fillStyle=g;c.fill();c.restore();}
    for(const r of [-a,a]){c.save();c.rotate(r);petalPath(c,L,s*.42);c.fillStyle=g;c.fill();
      c.strokeStyle=rgb(mix(B,[0,0,0],.4),.3);c.lineWidth=Math.max(.6,s*.03);c.stroke();c.restore();}
    petalPath(c,L*1.02,s*.44);c.fillStyle=g2;c.fill();
    c.strokeStyle=rgb(mix(B,[0,0,0],.4),.25);c.lineWidth=Math.max(.6,s*.03);c.stroke();
    c.restore();return;
  }
  c.rotate((1-e)*-.8);
  c.scale(sc,sc);
  if(f.type==='daisy'){
    const n=f.n,g=c.createLinearGradient(0,-s*.2,0,-s);
    g.addColorStop(0,rgb(B));g.addColorStop(1,rgb(A));
    for(let i=0;i<n;i++){
      c.save();c.rotate(i/n*TAU+f.jit[i]*.05);
      petalPath(c,s*(1+f.jit[i+1]*.06),s*.2);
      c.fillStyle=g;c.fill();
      c.strokeStyle=rgb(mix(B,[0,0,0],.35),.28);c.lineWidth=Math.max(.5,s*.02);c.stroke();
      c.restore();
    }
    const cg=c.createRadialGradient(-s*.07,-s*.07,0,0,0,s*.3);
    cg.addColorStop(0,rgb(mix(C,[255,255,255],.4)));cg.addColorStop(1,rgb(mix(C,[120,60,0],.4)));
    c.beginPath();c.arc(0,0,s*.28,0,TAU);c.fillStyle=cg;c.fill();
    c.fillStyle='rgba(110,55,0,.35)';
    for(let k=1;k<12;k++){const an=k*2.4,rr=s*.21*Math.sqrt(k/12);
      c.beginPath();c.arc(Math.cos(an)*rr,Math.sin(an)*rr,s*.022,0,TAU);c.fill();}
  }else if(f.type==='round5'){
    const g=c.createLinearGradient(0,0,0,-s);
    g.addColorStop(0,rgb(B));g.addColorStop(.45,rgb(mix(B,A,.6)));g.addColorStop(1,rgb(A));
    for(let i=0;i<5;i++){
      c.save();c.rotate(i/5*TAU);
      petalPath(c,s,s*.6,true);c.fillStyle=g;c.fill();
      c.strokeStyle=rgb(mix(B,[0,0,0],.3),.22);c.lineWidth=Math.max(.5,s*.02);c.stroke();
      c.restore();
    }
    c.strokeStyle=rgb(mix(C,[255,255,255],.3),.9);c.fillStyle=rgb(C);c.lineWidth=Math.max(.5,s*.022);
    for(let k=0;k<10;k++){const an=k/10*TAU+.3,rr=s*(.3+.07*f.jit[k]);
      c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(an)*rr,Math.sin(an)*rr);c.stroke();
      c.beginPath();c.arc(Math.cos(an)*rr,Math.sin(an)*rr,s*.035,0,TAU);c.fill();}
    c.beginPath();c.arc(0,0,s*.09,0,TAU);c.fillStyle=rgb(mix(B,[60,0,20],.4));c.fill();
  }else if(f.type==='dahlia'){
    for(let L=0;L<DAHLIA_L.length;L++){
      const [n,r,wk]=DAHLIA_L[L],len=s*r;
      const g=c.createLinearGradient(0,0,0,-len);
      g.addColorStop(0,rgb(mix(B,[40,0,30],.35)));g.addColorStop(.5,rgb(mix(B,A,L*.1)));g.addColorStop(1,rgb(mix(A,B,L*.2)));
      for(let i=0;i<n;i++){
        c.save();c.rotate(i/n*TAU+L*.4);
        petalPath(c,len,len*wk);c.fillStyle=g;c.fill();
        c.strokeStyle=rgb(mix(B,[0,0,0],.4),.3);c.lineWidth=Math.max(.5,s*.018);c.stroke();
        c.restore();
      }
    }
    c.beginPath();c.arc(0,0,s*.1,0,TAU);c.fillStyle=rgb(mix(C,B,.3));c.fill();
  }else{ /* rose */
    const deep=mix(B,[24,0,12],.6);
    for(let L=0;L<ROSE_L.length;L++){
      const [n,r,wk]=ROSE_L[L];
      const nr=L+1<ROSE_L.length?ROSE_L[L+1][1]:.1;
      const lp=easeOut(clamp01((b-L*.1)/.6));
      const len=s*r*(.5+.5*lp),wd=len*wk;
      const st=clamp(nr/r-.12,0,.8);
      const g=c.createLinearGradient(0,0,0,-len);
      g.addColorStop(0,rgb(deep));g.addColorStop(st,rgb(deep));
      g.addColorStop(Math.min(.97,st+.3),rgb(B));g.addColorStop(1,rgb(mix(B,A,.85)));
      for(let i=0;i<n;i++){
        c.save();c.rotate(i/n*TAU+L*.9+(1-lp)*.9+f.jit[L*6+i]*.1);
        petalPath(c,len*(1+f.jit[L*6+i+1]*.04),wd);c.fillStyle=g;c.fill();
        c.strokeStyle=rgb(deep,.4);c.lineWidth=Math.max(.5,s*.022);c.stroke();
        c.restore();
      }
    }
    c.beginPath();
    for(let t=0;t<TAU*1.5;t+=.25){const rr=s*.015+s*.085*t/(TAU*1.5);
      const x=Math.cos(t)*rr,y=Math.sin(t)*rr;t===0?c.moveTo(x,y):c.lineTo(x,y);}
    c.strokeStyle=rgb(deep,.75);c.lineWidth=Math.max(.6,s*.03);c.lineCap='round';c.stroke();
  }
  c.restore();
}

function paintHead(c,f,b,dpr){
  if(b>=1){
    if(!f.sprite){
      const half=Math.ceil(f.s*1.85),cv=document.createElement('canvas');
      cv.width=cv.height=Math.ceil(half*2*dpr);
      const k=cv.getContext('2d');k.scale(dpr,dpr);k.translate(half,half);
      drawHead(k,f,1);f.sprite=cv;f.half=half;
    }
    c.drawImage(f.sprite,-f.half,-f.half,f.half*2,f.half*2);
  }else if(b>0)drawHead(c,f,b);
}

function drawLeaf(c,len,light){
  const w=len*.3;
  c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(len*.45,-w,len,0);c.quadraticCurveTo(len*.45,w,0,0);
  c.fillStyle=light?'#43a35f':'#2f7f49';c.fill();
  c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(len*.5,-w*.12,len*.92,0);
  c.strokeStyle='rgba(12,58,30,.55)';c.lineWidth=Math.max(.7,len*.03);c.stroke();
}

const qPoint=(p0,p1,p2,t)=>{const u=1-t;return{x:u*u*p0.x+2*u*t*p1.x+t*t*p2.x,y:u*u*p0.y+2*u*t*p1.y+t*t*p2.y};};

en,wd,notch){\n  c.beginPath();\n  c.moveTo(0,0);\n  if(notch){\n    c.bezierCurveTo(-wd,-len*.3,-wd*.85,-len*1.02,-wd*.2,-len*.98);\n    c.quadraticCurveTo(-wd*.05,-len*.93,0,-len*.84);\n    c.quadraticCurveTo(wd*.05,-len*.93,wd*.2,-len*.98);\n  }else{\n    c.bezierCurveTo(-wd,-len*.3,-wd*.85,-len*1.02,0,-len);\n  }\n  c.bezierCurveTo(wd*.85,-len*1.02,wd,-len*.3,0,0);\n  c.closePath();\n}\n\nfunction newLook(type,pal,s){\n  return {type,pal,s,rot:rnd(0,TAU),n:12+((Math.random()*5)|0),\n    jit:Array.from({length:40},()=>rnd(-1,1)),sprite:null,half:0};\n}\n\nconst ROSE_L=[[5,1,.64],[5,.8,.62],[4,.6,.63],[3,.42,.67],[3,.25,.76]];\nconst DAHLIA_L=[[13,1,.19],[11,.76,.21],[9,.54,.24],[6,.32,.28]];\n\nfunction drawHead(c,f,b){\n  const s=f.s,A=f.pal.a,B=f.pal.b,C=f.pal.c;\n  b=clamp01(b);\n  const e=easeBack(b),sc=.12+.88*e;\n  c.save();\n  if(f.type==='tulip'){\n    c.scale(sc,sc);\n    const a=.08+.2*easeOut(b),L=s*1.45;\n    const g=c.createLinearGradient(0,0,0,-L);\n    g.addColorStop(0,rgb(mix(B,[40,0,30],.3)));g.addColorStop(1,rgb(mix(A,B,.35)));\n    const g2=c.createLinearGradient(0,0,0,-L);\n    g2.addColorStop(0,rgb(B));g2.addColorStop(1,rgb(A));\n    for(const r of [-a*2.1,a*2.1]){c.save();c.rotate(r);petalPath(c,L*.96,s*.4);c.fillStyle=g;c.fill();c.restore();}\n    for(const r of [-a,a]){c.save();c.rotate(r);petalPath(c,L,s*.42);c.fillStyle=g;c.fill();\n      c.strokeStyle=rgb(mix(B,[0,0,0],.4),.3);c.lineWidth=Math.max(.6,s*.03);c.stroke();c.restore();}\n    petalPath(c,L*1.02,s*.44);c.fillStyle=g2;c.fill();\n    c.strokeStyle=rgb(mix(B,[0,0,0],.4),.25);c.lineWidth=Math.max(.6,s*.03);c.stroke();\n    c.restore();return;\n  }\n  c.rotate((1-e)*-.8);\n  c.scale(sc,sc);\n  if(f.type==='daisy'){\n    const n=f.n,g=c.createLinearGradient(0,-s*.2,0,-s);\n    g.addColorStop(0,rgb(B));g.addColorStop(1,rgb(A));\n    for(let i=0;i<n;i++){\n      c.save();c.rotate(i/n*TAU+f.jit[i]*.05);\n      petalPath(c,s*(1+f.jit[i+1]*.06),s*.2);\n      c.fillStyle=g;c.fill();\n      c.strokeStyle=rgb(mix(B,[0,0,0],.35),.28);c.lineWidth=Math.max(.5,s*.02);c.stroke();\n      c.restore();\n    }\n    const cg=c.createRadialGradient(-s*.07,-s*.07,0,0,0,s*.3);\n    cg.addColorStop(0,rgb(mix(C,[255,255,255],.4)));cg.addColorStop(1,rgb(mix(C,[120,60,0],.4)));\n    c.beginPath();c.arc(0,0,s*.28,0,TAU);c.fillStyle=cg;c.fill();\n    c.fillStyle='rgba(110,55,0,.35)';\n    for(let k=1;k<12;k++){const an=k*2.4,rr=s*.21*Math.sqrt(k/12);\n      c.beginPath();c.arc(Math.cos(an)*rr,Math.sin(an)*rr,s*.022,0,TAU);c.fill();}\n  }else if(f.type==='round5'){\n    const g=c.createLinearGradient(0,0,0,-s);\n    g.addColorStop(0,rgb(B));g.addColorStop(.45,rgb(mix(B,A,.6)));g.addColorStop(1,rgb(A));\n    for(let i=0;i<5;i++){\n      c.save();c.rotate(i/5*TAU);\n      petalPath(c,s,s*.6,true);c.fillStyle=g;c.fill();\n      c.strokeStyle=rgb(mix(B,[0,0,0],.3),.22);c.lineWidth=Math.max(.5,s*.02);c.stroke();\n      c.restore();\n    }\n    c.strokeStyle=rgb(mix(C,[255,255,255],.3),.9);c.fillStyle=rgb(C);c.lineWidth=Math.max(.5,s*.022);\n    for(let k=0;k<10;k++){const an=k/10*TAU+.3,rr=s*(.3+.07*f.jit[k]);\n      c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(an)*rr,Math.sin(an)*rr);c.stroke();\n      c.beginPath();c.arc(Math.cos(an)*rr,Math.sin(an)*rr,s*.035,0,TAU);c.fill();}\n    c.beginPath();c.arc(0,0,s*.09,0,TAU);c.fillStyle=rgb(mix(B,[60,0,20],.4));c.fill();\n  }else if(f.type==='dahlia'){\n    for(let L=0;L<DAHLIA_L.length;L++){\n      const [n,r,wk]=DAHLIA_L[L],len=s*r;\n      const g=c.createLinearGradient(0,0,0,-len);\n      g.addColorStop(0,rgb(mix(B,[40,0,30],.35)));g.addColorStop(.5,rgb(mix(B,A,L*.1)));g.addColorStop(1,rgb(mix(A,B,L*.2)));\n      for(let i=0;i<n;i++){\n        c.save();c.rotate(i/n*TAU+L*.4);\n        petalPath(c,len,len*wk);c.fillStyle=g;c.fill();\n        c.strokeStyle=rgb(mix(B,[0,0,0],.4),.3);c.lineWidth=Math.max(.5,s*.018);c.stroke();\n        c.restore();\n      }\n    }\n    c.beginPath();c.arc(0,0,s*.1,0,TAU);c.fillStyle=rgb(mix(C,B,.3 ;return [Math.cos(az)*(rb+.035*Math.cos(b)),Math.sin(az)*(rb+.035*Math.cos(b)),zb+.15*Math.sin(b)];},true));\n  for(const sgn of [-1,1]){\n    parts.push(surfGeo(16,12,(u,v)=>{const b=v*TAU,r=.3*Math.pow(Math.sin(Math.PI*Math.pow(u,.62)),.8),x=u*.95;\n      return [sgn*(.06+x),-rb-.1+r*.42*Math.cos(b)-x*.08,zb+x*.22+r*Math.sin(b)];},false));\n    parts.push(surfGeo(14,4,(u,v)=>{const w=(v-.5)*.3*(1+u*.25);\n      return [sgn*(.1+u*.52)+w,-rb-.08+.06*Math.sin(u*6),zb-.1-u*1.25+Math.abs(v-.5)*u*u*.5+w*sgn*.3];},false));\n  }\n  parts.push(surfGeo(12,8,(u,v)=>{const a=u*TAU,th=v*Math.PI;return [.14*Math.cos(a)*Math.sin(th),-rb-.14+.1*Math.sin(a)*Math.sin(th),zb+.02+.15*Math.cos(th)];},true));\n  E.addMesh('bow',mergeGeo(parts));\n}\nfunction sizeBq(){\n  const r=bq.getBoundingClientRect();bw=r.width;bh=r.height;\n  for(const c of [bq,spc]){c.width=Math.round(bw*DPR);c.height=Math.round(bh*DPR);}\n  if(!E)return;\n  const e=23*Math.PI/180,c=E.cam;c.SE=Math.sin(e);c.CE=Math.cos(e);c.D=16;c.TZ=-.95;c.W=bw;c.H=bh;\n  const U=Math.min(bw*.96/6.5,bh*.98/6.9);c.F=2*U*c.D/bh;c.YOFF=.02;\n}\nconst PAPER_M=rotZ(.5);\nfunction drawBouquet(T,now,dt){\n  if(E){\n    E.cam.spin=Math.sin(now*.45)*.38;\n    E.begin();\n    const pk=easeBack(clamp01(T/.9));\n    if(pk>0){\n      E.mesh('paper',{pos:[0,0,TIE[2]*(1-pk)],s:pk,kind:3,c0:[.9,.42,.58],c1:[1,.8,.86]});\n      E.mesh('paper2',{pos:[0,0,TIE[2]*(1-pk)],s:pk,kind:3,c0:[.62,.1,.28],c1:[.86,.36,.54]});\n      E.mesh('bow',{pos:[0,0,-2.5*(1-pk)],s:pk,kind:4,c0:[.72,.05,.2]});\n    }\n    for(const f of HEADS){const g=easeOut(clamp01((T-f.delay)/.8));if(g>0)E.tube({p0:TIE,p1:f.p1,p2:f.pos,grow:g,rad:.05});}\n    for(const f of MINIS){const g=easeOut(clamp01((T-f.delay)/.8));if(g>0)E.tube({p0:TIE,p1:f.p1,p2:f.pos,grow:g,rad:.018});}\n    for(const lf of GREENS){const g=easeBack(clamp01((T-lf.d)/.9));if(g>0)E.mesh('leaf',{pos:lf.pos,M:lf.M,s:lf.s*g,kind:1});}\n    for(const f of HEADS){\n      const k=easeBack(clamp01((T-f.delay-.55)/. function buildThumbScenes(){
  F0=newFlower3('rose','red',1);
  GARD=[['daisy','white',-1.35,2.3,.72],['cosmos','pink',0,3.25,.8],['tulip','gold',1.3,2.5,.52]].map(([t,p,x,h,s],i)=>{
    const f=newFlower3(t,p,s);f.x=x;f.h=h;f.b=(i-1)*-.35;f.ph=i*2.1;f.la=i%2?Math.PI+.2:-.2;return f;});
  const add=(tilt,az,pal,s)=>{const dir=[Math.sin(tilt)*Math.cos(az),Math.sin(tilt)*Math.sin(az),Math.cos(tilt)];
    const f=newFlower3('rose',pal,s);f.pos=[dir[0]*1.25,dir[1]*1.25,-.5+dir[2]*1.25];f.M=basis([dir[0],dir[1],dir[2]+.25],f.roll);BQ.push(f);};
  add(0,0,'red',.6);
  ['pink','red','peach','pink','red','white'].forEach((p,i)=>add(.85,i/6*TAU-1.2,p,.5));
  for(let i=0;i<6;i++){const az=(i+.5)/6*TAU-1.2;BQL.push({pos:[Math.cos(az)*.55,Math.sin(az)*.55,-.35],M:leafM(az,.55),s:1.05});}
  E.addMesh('wrap',surfGeo(56,12,(u,v)=>{
    const az=u*TAU,front=Math.pow(Math.max(0,-Math.sin(az)),2);
    const zr=.5-.6*front+.05*Math.sin(az*5+1);
    const t=clamp01((v-.3)/.6),sm=Math.pow(t*t*(3-2*t),.9);
    const r=(.24+.45*v+2.2*sm)*(1+.02*Math.sin(az*11)*v);
    return [Math.cos(az)*r,Math.sin(az)*r,lerp(-3.6,zr,v)];},true));
}
function sizeThumbs(){
  for(const t of thumbs){const r=t.cv.getBoundingClientRect(),px=Math.max(64,Math.round(r.width*DPR));
    if(t.cv.width!==px){t.cv.width=px;t.cv.height=px;}}
  if(E){const px=thumbs[0].cv.width;tgl.width=px;tgl.height=px;E.cam.W=E.cam.H=px;}
}
function setCam(deg,D,TZ,F,YOFF,spin){const c=E.cam,e=deg*Math.PI/180;c.SE=Math.sin(e);c.CE=Math.cos(e);c.D=D;c.TZ=TZ;c.F=F;c.YOFF=YOFF;c.spin=spin;}
function drawThumbs(t){
  if(!E)return;
  /* 1: gulab */
  setCam(38,10,.05,5.4,.06,t*.5);E.begin();
  E.tube({p0:[.3,0,-3.4],p1:[-.25,0,-1.6],p2:[0,0,0],grow:1,rad:.075});
  E.mesh('leaf',{pos:[-.08,0,-1.25],M:leafM(.6,.3),s:1.35,kind:1});
  E.mesh('leaf',{pos:[.02,0,-1.9],M:leafM(3.7,.3),s:1.2,kind:1});
  E.head(F0,[0,0,0],I3,1,.93+.07*Math.sin(t*.9));
  copyThumb(0);
  /* 2: bagh */
  setCam(10,14,1.75,5.6,0,0);E.begin();
  for(const f of GARD){
    const sw=Math.sin(t*1.2+f.ph)*.13;
    f.p2=[f.x+f.b*.4+sw,0,f.h];
    E.tube({p0:[f.x,0,-.4],p1:[f.x+f.b,0,f.h*.55],p2:f.p2,grow:1,rad:.06});
    E.mesh('leaf',{pos:[f.x+f.b*.55,0,f.h*.33],M:rotZ(f.la),s:1,kind:1});
  }
  for(const f of GARD)E.head(f,f.p2,basis(f.type==='tulip'?[.1,-.42,1]:[0,-.95,.3],f.roll+Math.sin(t*.6+f.ph)*.1),1,1);
  copyThumb(1);
  /* 3: guldasta */
  setCam(26,14,-.55,6.6,0,Math.sin(t*.5)*.5);E.begin();
  E.mesh('wrap',{pos:[0,0,-.12],s:.6,kind:3,c0:[.86,.36,.54],c1:[1,.8,.86]});
  for(const lf of BQL)E.mesh('leaf',{pos:lf.pos,M:lf.M,s:lf.s,kind:1});
  for(const f of BQ)E.head(f,f.pos,f.M,1,1);
  copyThumb(2);
}
function copyThumb(i){const t=thumbs[i];t.ctx.clearRect(0,0,t.cv.width,t.cv.height);t.ctx.drawImage(tgl,0,0,t.cv.width,t.cv.height);}

function frame(ts){
  if(!running)return;
  const now=ts/1000,dt=Math.min(.05,now-last||0);last=now;
  mx.setTransform(DPR,0,0,DPR,0,0);mx.clearRect(0,0,W,H);
  for(const o of bokeh){
    o.x+=o.vx*dt;o.y+=o.vy*dt;
    if(o.y<-o.r)o.y=H+o.r;if(o.x<-o.r)o.x=W+o.r;if(o.x>W+o.r)o.x=-o.r;
    const a=o.a*(.7+.3*Math.sin(now*.7+o.ph)),g=mx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r),col=o.gold?[255,214,150]:[255,120,160];
    g.addColorStop(0,rgb(col,a));g.addColorStop(.6,rgb(col,a*.55));g.addColorStop(1,rgb(col,0));
    mx.fillStyle=g;mx.beginPath();mx.arc(o.x,o.y,o.r,0,TAU);mx.fill();
  }
  for(let i=0;i<petals.length;i++){
    const p=petals[i];
    p.x+=(p.vx+Math.sin(now*1.1+p.ph)*20)*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.spin+=p.vs*dt;
    if(p.y>H+30){petals[i]=newPetal(false);continue;}
    const cs=Math.cos(p.spin);
    mx.save();mx.translate(p.x,p.y);mx.rotate(p.rot);mx.scale(cs*.85+.15*(cs<0?-1:1),1);
    petalPath(mx,p.sz,p.sz*.56);
    const pg=mx.createLinearGradient(0,0,0,-p.sz);pg.addColorStop(0,'rgba(140,16,48,.75)');pg.addColorStop(1,rgb(mix([216,30,74],[255,118,146],p.k),.75));
    mx.fillStyle=pg;mx.fill();mx.restore();
  }
  drawThumbs(now);
  rafId=requestAnimationFrame(frame);
}

/* ---------- page kholna / wapas aana ---------- */
let current=null,busy=false;
const safeJSON=o=>JSON.stringify(o).replace(/</g,'\\u003c');
function openPage(key){
  if(busy||!PAGES[key])return;busy=true;
  curtain.classList.add('on');
  setTimeout(()=>{
    running=false;cancelAnimationFrame(rafId);menu.classList.add('off');
    const f=document.createElement('iframe');f.setAttribute('title',key);
    let done=false;const show=()=>{if(done)return;done=true;curtain.classList.remove('on');backBtn.classList.add('on');busy=false;};
    f.addEventListener('load',()=>setTimeout(show,120));setTimeout(show,2500);
    f.srcdoc=PAGES[key].replace('__CFG__',()=>safeJSON(MESSAGES[key]));
    stage.appendChild(f);stage.classList.add('on');current=f;
  },460);
}
function goBack(){
  if(busy||!current)return;busy=true;
  backBtn.classList.remove('on');curtain.classList.add('on');
  setTimeout(()=>{
    try{const g=current.contentWindow&&current.contentWindow.__gl;const x=g&&g.getExtension('WEBGL_lose_context');if(x)x.loseContext();}catch(err){}
    current.remove();current=null;stage.classList.remove('on');
    menu.classList.remove('off');menu.scrollTop=0;
    running=true;last=0;rafId=requestAnimationFrame(frame);
    curtain.classList.remove('on');busy=false;
  },460);
}
backBtn.addEventListener('click',goBack);

/* ---------- gaana: menu aate hi shuru, kabhi nahi rukta ---------- */
const song=$('song'),splash=$('splash');
$('spTitle').textContent=MM.gift;$('spTap').textContent=MM.giftTap;
let songOn=false;
function ready(){menu.classList.add('ready');}
function hideSplash(){if(!splash.classList.contains('on')){ready();return;}splash.classList.add('bye');ready();setTimeout(()=>splash.classList.remove('on'),950);}
function startSong(){const p=song.play();if(p&&p.then)p.then(()=>{songOn=true;}).catch(()=>{});else songOn=true;}
(function initSong(){
  const b64=$('songData').textContent.replace(/<!--.*?-->/g,'').trim();
  if(b64){
    try{const bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      song.src=URL.createObjectURL(new Blob([u8],{type:SONG_TYPE}));}catch(err){console.error(err);}
  }else song.src=SONG_FILE;
  song.addEventListener('error',()=>{if(!songOn)hideSplash();});
  song.addEventListener('ended',()=>{song.currentTime=0;startSong();});
  splash.classList.add('on');
  const p=song.play();
  if(p&&p.then)p.then(()=>{songOn=true;hideSplash();}).catch(()=>{});
  splash.addEventListener('click',()=>{startSong();hideSplash();});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&songOn&&song.paused)startSong();});
  addEventListener('pointerdown',()=>{if(songOn&&song.paused)startSong();});
})();
addEventListener('resize',sizeMenu);
if(E){try{buildThumbScenes();for(const t of thumbs)t.ic.style.display='none';}catch(err){console.error(err);E=null;}}
sizeMenu();
rafId=requestAnimationFrame(frame);
</script>

<script>
/* Gaana — sirf repo ki alvida.aac
   <audio id="song"> loop par alvida.aac chalata hai. Player main page par hai,
   option pages ke andar nahi — is liye option choose karne ya Wapas aane par
   gaana nahi rukta. Neeche right corner wala ♪ button sirf isi file ko
   chalata / band karta hai. */
(function(){
  var audio=document.getElementById('song');
  var musicBtn=document.getElementById('musicBtn');
  function playSong(){ if(audio){ try{ var pr=audio.play(); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){} } }
  function syncBtn(){ if(musicBtn){ musicBtn.textContent = (audio && !audio.paused) ? '\u275A\u275A' : '\u266A'; musicBtn.setAttribute('aria-label', (audio && !audio.paused) ? 'Gaana band karo' : 'Gaana chalao'); } }
  if(musicBtn){ musicBtn.addEventListener('click',function(e){
    e.stopPropagation();
    if(!audio) return;
    if(audio.paused){ playSong(); }
    else { try{ audio.pause(); }catch(err){} }
    syncBtn();
  }); }
  if(audio){ audio.addEventListener('playing',syncBtn); audio.addEventListener('pause',syncBtn); }
  document.addEventListener('pointerdown',function(){
    if(audio && audio.paused && audio.currentTime>0){ playSong(); }
  });
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden && audio && audio.paused && audio.currentTime>0){ playSong(); }
  });
})();
</script>
